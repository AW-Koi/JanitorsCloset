<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="256" height="256" viewBox="0 0 256 256">
  <!-- Utility sink: a low steel mop basin with a wall tap behind it -->
  <defs>
    <rect id="pipe" x="118" y="22" width="20" height="58" rx="6"/>
    <rect id="tap" x="92" y="40" width="72" height="24" rx="10"/>
    <rect id="basin" x="38" y="70" width="180" height="150" rx="22"/>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d3d7dd"/><stop offset="1" stop-color="#9a9fa7"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6d737c"/><stop offset="1" stop-color="#8d939b"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8cc4e0"/><stop offset="1" stop-color="#5d9cc4"/></linearGradient>
  </defs>

  <!-- Outline -->
  <g fill="#111" stroke="#111" stroke-width="16" stroke-linejoin="round">
    <use xlink:href="#pipe"/><use xlink:href="#tap"/><use xlink:href="#basin"/>
  </g>

  <g stroke="#2a2d33" stroke-width="4" stroke-linejoin="round">
    <!-- Wall tap -->
    <use xlink:href="#pipe" fill="url(#steel)"/>
    <use xlink:href="#tap" fill="url(#steel)"/>
    <circle cx="104" cy="52" r="9" fill="#5d9cc4"/>
    <circle cx="152" cy="52" r="9" fill="#c8402e"/>

    <!-- Basin with water -->
    <use xlink:href="#basin" fill="url(#steel)"/>
    <rect x="58" y="90" width="140" height="110" rx="14" fill="url(#inner)"/>
    <rect x="66" y="118" width="124" height="74" rx="12" fill="url(#water)"/>
    <path d="M84 140 Q100 132 116 140" fill="none" stroke="#c9e6f4" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
