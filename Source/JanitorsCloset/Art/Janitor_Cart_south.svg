<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="512" height="512" viewBox="0 0 512 512">
  <!-- Janitor's cart, facing south: mop bucket nearest, shelf frame behind, bin bag on the cart's right -->
  <defs>
    <rect id="frame" x="164" y="110" width="184" height="252" rx="12"/>
    <path id="bag" d="M112 214 Q104 300 128 344 Q150 362 172 344 Q190 300 182 214 Z"/>
    <rect id="wringer" x="196" y="174" width="120" height="56" rx="12"/>
    <rect id="bucket" x="176" y="236" width="160" height="140" rx="14"/>
    <rect id="bucketRim" x="170" y="220" width="172" height="30" rx="12"/>
    <rect id="base" x="156" y="350" width="200" height="30" rx="12"/>
    <circle id="wheelLeft" cx="178" cy="390" r="20"/>
    <circle id="wheelRight" cx="334" cy="390" r="20"/>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6aa4ea"/><stop offset="1" stop-color="#3f78c4"/></linearGradient>
    <linearGradient id="post" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b95dc"/><stop offset="1" stop-color="#3a6fb8"/></linearGradient>
    <linearGradient id="interior" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3159"/><stop offset="1" stop-color="#25467a"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2d23e"/><stop offset="1" stop-color="#c99f1a"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7e070"/><stop offset="1" stop-color="#ddb825"/></linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c3c7cd"/><stop offset="1" stop-color="#8d9199"/></linearGradient>
    <linearGradient id="bag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#70747d"/><stop offset="1" stop-color="#454850"/></linearGradient>
  </defs>

  <!-- Outline -->
  <g fill="#111" stroke="#111" stroke-width="26" stroke-linejoin="round">
    <use xlink:href="#frame"/><use xlink:href="#bag"/><use xlink:href="#wringer"/><use xlink:href="#bucket"/><use xlink:href="#bucketRim"/>
    <use xlink:href="#base"/><use xlink:href="#wheelLeft"/><use xlink:href="#wheelRight"/>
  </g>

  <g stroke="#152440" stroke-width="5" stroke-linejoin="round">
    <!-- Shelf frame behind the bucket -->
    <use xlink:href="#frame" fill="url(#interior)"/>
    <rect x="164" y="110" width="184" height="28" rx="12" fill="url(#rail)"/>
    <rect x="164" y="190" width="184" height="22" rx="8" fill="url(#rail)"/>
    <rect x="164" y="110" width="26" height="252" rx="10" fill="url(#post)"/>
    <rect x="322" y="110" width="26" height="252" rx="10" fill="url(#post)"/>

    <!-- Bin bag hanging off the cart's right side -->
    <use xlink:href="#bag" fill="url(#bag)"/>
    <rect x="108" y="204" width="78" height="20" rx="8" fill="#2c2e33"/>

    <!-- Mop bucket with water and wringer, nearest the viewer -->
    <use xlink:href="#wringer" fill="url(#steel)"/>
    <use xlink:href="#bucket" fill="url(#yellow)"/>
    <use xlink:href="#bucketRim" fill="url(#rim)"/>
    <rect x="190" y="228" width="144" height="12" rx="6" fill="#5d9cc4" stroke="none"/>
    <path d="M198 268 L198 350" fill="none" stroke="#f7e070" stroke-width="12" stroke-linecap="round" opacity="0.7"/>

    <!-- Base rail and wheels -->
    <use xlink:href="#base" fill="url(#rail)"/>
    <use xlink:href="#wheelLeft" fill="#3a3c42"/>
    <use xlink:href="#wheelRight" fill="#3a3c42"/>
    <circle cx="178" cy="390" r="7" fill="#b9bdc4" stroke="none"/>
    <circle cx="334" cy="390" r="7" fill="#b9bdc4" stroke="none"/>
  </g>
</svg>
